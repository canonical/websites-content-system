name: CI
on:
  push:
    branches:
      - main
      - feature-**
      - feature/**
  pull_request:
    branches:
      - main
      - feature-**
      - feature/**

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v3
      - name: Restore node_modules
        id: yarn-cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install
      - run: yarn lint

  test-js:
    name: Test JS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v3
      - name: Restore node_modules
        id: yarn-cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install
      - run: yarn test-js

  test-python:
    name: Test Python
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

        run: pytest webapp/tests

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v3
      - name: Restore node_modules
        id: yarn-cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install
      - run: CI=false yarn build

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: pip install ruff
      - name: Lint
        run: ruff check

  run-python:
    name: Run Python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run service
        env:
          GOOGLE_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GOOGLE_PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SECRET_KEY: secret_key
          GH_TOKEN: ${{ github.token }}
          REPO_ORG: https://github.com/canonical
          JIRA_CLIENT_ID: client-id
          JIRA_CLIENT_SECRET: client-secret
          JIRA_URL: https://example.atlassian.net
          JIRA_LABELS: somelabel
          JIRA_COPY_UPDATES_EPIC: WD-9999999
          GOOGLE_DRIVE_FOLDER_ID: folderid
          COPYDOC_TEMPLATE_ID: templateid
          FLASK_DEBUG: 1
        run: |
          gunicorn webapp.app:app --workers=2 --bind 0.0.0.0:8104 & sleep 3
          curl --head --fail --retry-delay 1 --retry 30 --retry-connrefused http://localhost:8104

  run-python-redis:
    name: Run Python Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run service
        env:
          GOOGLE_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GOOGLE_PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SECRET_KEY: secret_key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          GH_TOKEN: ${{ github.token }}
          REPO_ORG: https://github.com/canonical
          JIRA_CLIENT_ID: client-id
          JIRA_CLIENT_SECRET: client-secret
          JIRA_URL: https://example.atlassian.net
          JIRA_LABELS: somelabel
          JIRA_COPY_UPDATES_EPIC: WD-9999999
          GOOGLE_DRIVE_FOLDER_ID: folderid
          COPYDOC_TEMPLATE_ID: templateid
          FLASK_DEBUG: 1
        run: |
          flask --app webapp.app run --debug & sleep 3
          curl --head --fail --retry-delay 1 --retry 30 --retry-connrefused http://localhost:5000

  run-image:
    name: Run Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: DOCKER_BUILDKIT=1 docker build --tag websites-content-system .

      - name: Run image
        env:
          GOOGLE_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GOOGLE_PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }}
        run: |
          docker run \
          -p 8104:80 \
          -e SECRET_KEY=secret_key \
          -e REDIS_HOST=localhost \
          -e REDIS_PORT=6379 \
          -e GH_TOKEN=github.token \
          -e REPO_ORG=https://github.com/canonical \
          -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
          -e JIRA_CLIENT_ID=client-id \
          -e JIRA_CLIENT_SECRET=client-secret \
          -e JIRA_URL=https://example.atlassian.net \
          -e JIRA_LABELS=somelabel \
          -e JIRA_COPY_UPDATES_EPIC=WD-9999999 \
          -e GOOGLE_DRIVE_FOLDER_ID=folderid \
          -e COPYDOC_TEMPLATE_ID=templateid \
          -e GOOGLE_PRIVATE_KEY="$GOOGLE_PRIVATE_KEY" \
          -e GOOGLE_PRIVATE_KEY_ID="$GOOGLE_PRIVATE_KEY_ID" \
          -e FLASK_DEBUG=1 \
          --network host \
          websites-content-system & sleep 3
          curl --head --fail --retry-delay 1 --retry 30 --retry-connrefused http://localhost
